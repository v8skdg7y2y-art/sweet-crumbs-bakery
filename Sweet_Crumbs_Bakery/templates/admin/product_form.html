<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Sweet Crumbs Bakery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="site-header">
    <div class="logo">
        <a href="{{ url_for('home') }}">Sweet Crumbs Bakery</a>
    </div>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('admin_products') }}">Manage Products</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
</header>

<main class="page-container">

    <section class="page-heading">
        <p class="eyebrow">Administration</p>
        <h1>{{ page_title }}</h1>
        <p>Complete the details below and save the product.</p>
    </section>

    <section class="form-card">

        <form method="POST">

            <div class="form-group">
                <label for="name">Product Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ product.name if product else '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                >{{ product.description if product else '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="price">Price</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    step="0.01"
                    min="0"
                    value="{{ product.price if product else '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="image">Image URL</label>
                <input
                    type="text"
                    id="image"
                    name="image"
                    value="{{ product.image if product else '' }}"
                    placeholder="Example: /static/images/cake.jpg"
                >
            </div>

            <div class="form-group">
                <label for="stock">Stock Quantity</label>
                <input
                    type="number"
                    id="stock"
                    name="stock"
                    min="0"
                    value="{{ product.stock if product else 0 }}"
                    required
                >
            </div>

            <div class="form-actions">
                <button class="button" type="submit">
                    Save Product
                </button>

                <a class="button secondary-button" href="{{ url_for('admin_products') }}">
                    Cancel
                </a>
            </div>

        </form>

    </section>

</main>

<footer>
    <p>&copy; 2026 Sweet Crumbs Bakery. All rights reserved.</p>
</footer>

</body>
</html>
